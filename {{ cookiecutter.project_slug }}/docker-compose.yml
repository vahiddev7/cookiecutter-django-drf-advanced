services:
  {% if cookiecutter.database_engine == 'postgresql' %}
  db:
    image: postgres:17
    container_name: {{ cookiecutter.project_slug }}_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% elif cookiecutter.database_engine == 'mysql' %}
  db:
    image: mysql:8.0
    container_name: {{ cookiecutter.project_slug }}_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% elif cookiecutter.database_engine == 'sqlserver' %}
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: {{ cookiecutter.project_slug }}_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  {% if cookiecutter.database_engine == 'sqlserver' %}
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: {{ cookiecutter.project_slug }}_sqlserver_init
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    environment:
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/sqlserver/init-db.sh:/scripts/init-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: {{ cookiecutter.project_slug }}_app
    restart: unless-stopped
    env_file:
      - .env
    {% if cookiecutter.database_engine != 'sqlite' %}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      {% if cookiecutter.database_engine == 'sqlserver' %}
      DB_USER: sa
      {% endif %}
    {% endif %}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "8000:8000"
    {% if cookiecutter.database_engine == 'sqlserver' %}
    depends_on:
      db-init:
        condition: service_completed_successfully
    {% elif cookiecutter.database_engine != 'sqlite' %}
    depends_on:
      db:
        condition: service_healthy
    {% endif %}
    networks:
      - {{ cookiecutter.project_slug }}_network

  nginx:
    image: nginx:1.29-alpine
    container_name: {{ cookiecutter.project_slug }}_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - {{ cookiecutter.project_slug }}_network

  {% if cookiecutter.use_celery == 'y' %}
  {% if cookiecutter.celery_broker == 'redis' %}
  broker:
    image: redis:7-alpine
    container_name: {{ cookiecutter.project_slug }}_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% elif cookiecutter.celery_broker == 'rabbitmq' %}
  broker:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-app}
    container_name: {{ cookiecutter.project_slug }}_rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  worker:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: celery -A config worker -l info
    container_name: {{ cookiecutter.project_slug }}_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    {% if cookiecutter.database_engine != 'sqlite' %}
    environment:
      DB_HOST: db
    {% endif %}
    volumes:
      - media_data:/app/media
    {% if cookiecutter.database_engine == 'sqlserver' %}
    depends_on:
      db-init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    {% elif cookiecutter.database_engine != 'sqlite' %}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    {% else %}
    depends_on:
      broker:
        condition: service_healthy
    {% endif %}
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

volumes:
  {% if cookiecutter.database_engine == 'postgresql' %}
  postgres_data:
  {% elif cookiecutter.database_engine == 'mysql' %}
  mysql_data:
  {% elif cookiecutter.database_engine == 'sqlserver' %}
  sqlserver_data:
  {% endif %}
  static_data:
  media_data:
  nginx_logs:

networks:
  {{ cookiecutter.project_slug }}_network:
    driver: bridge
