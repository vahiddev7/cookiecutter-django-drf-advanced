services:
  {% if cookiecutter.database_engine == 'postgresql' %}
  db:
    image: postgres:17
    container_name: {{ cookiecutter.project_slug }}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% elif cookiecutter.database_engine == 'mysql' %}
  db:
    image: mysql:8.0
    container_name: {{ cookiecutter.project_slug }}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% elif cookiecutter.database_engine == 'sqlserver' %}
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: {{ cookiecutter.project_slug }}_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  {% if cookiecutter.database_engine == 'sqlserver' %}
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: {{ cookiecutter.project_slug }}_sqlserver_init
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    environment:
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/sqlserver/init-db.sh:/scripts/init-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  {% if cookiecutter.cloud_storage == 'silo' %}
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: {{ cookiecutter.project_slug }}_silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    networks:
      - {{ cookiecutter.project_slug }}_network

  silo-init:
    image: python:3.12-alpine
    container_name: {{ cookiecutter.project_slug }}_silo_init
    command: ["sh", "-c", "pip install --no-cache-dir boto3 && python /silo-init.py"]
    environment:
      AWS_S3_ENDPOINT_URL: http://silo:9000
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/silo-init.py:/silo-init.py:ro
    depends_on:
      silo:
        condition: service_healthy
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  migrate:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    container_name: {{ cookiecutter.project_slug }}_migrate
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      {% if cookiecutter.database_engine != 'sqlite' %}
      DB_HOST: db
      {% if cookiecutter.database_engine == 'sqlserver' %}
      DB_USER: sa
      {% endif %}
      {% endif %}
    volumes:
      - static_data:/app/staticfiles
      {% if cookiecutter.database_engine == 'sqlite' %}
      - sqlite_data:/app/data
      {% endif %}
    {% if cookiecutter.cloud_storage == 'silo' or cookiecutter.database_engine != 'sqlite' %}
    depends_on:
      {% if cookiecutter.cloud_storage == 'silo' %}
      silo-init:
        condition: service_completed_successfully
      {% endif %}
      {% if cookiecutter.database_engine == 'sqlserver' %}
      db-init:
        condition: service_completed_successfully
      {% elif cookiecutter.database_engine != 'sqlite' %}
      db:
        condition: service_healthy
      {% endif %}
    {% endif %}
    networks:
      - {{ cookiecutter.project_slug }}_network

  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: {{ cookiecutter.project_slug }}_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      {% if cookiecutter.database_engine != 'sqlite' %}
      DB_HOST: db
      {% if cookiecutter.database_engine == 'sqlserver' %}
      DB_USER: sa
      {% endif %}
      {% endif %}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      {% if cookiecutter.database_engine == 'sqlite' %}
      - sqlite_data:/app/data
      {% endif %}
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - {{ cookiecutter.project_slug }}_network

  nginx:
    image: nginx:1.29-alpine
    container_name: {{ cookiecutter.project_slug }}_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - {{ cookiecutter.project_slug }}_network

  {% if cookiecutter.use_celery == 'y' %}
  {% if cookiecutter.celery_broker == 'redis' %}
  broker:
    image: redis:7-alpine
    container_name: {{ cookiecutter.project_slug }}_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% elif cookiecutter.celery_broker == 'rabbitmq' %}
  broker:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set a unique RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set a strong RABBITMQ_DEFAULT_PASS in .env}
    container_name: {{ cookiecutter.project_slug }}_rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

  worker:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: celery -A config worker -l info
    container_name: {{ cookiecutter.project_slug }}_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
      {% if cookiecutter.database_engine != 'sqlite' %}
      DB_HOST: db
      {% if cookiecutter.database_engine == 'sqlserver' %}
      DB_USER: sa
      {% endif %}
      {% endif %}
    volumes:
      - media_data:/app/media
      {% if cookiecutter.database_engine == 'sqlite' %}
      - sqlite_data:/app/data
      {% endif %}
    {% if cookiecutter.database_engine == 'sqlserver' %}
    depends_on:
      db-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    {% elif cookiecutter.database_engine != 'sqlite' %}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    {% else %}
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    {% endif %}
    networks:
      - {{ cookiecutter.project_slug }}_network

  flower:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: celery -A config flower --address=0.0.0.0 --port=5555 --basic-auth=${FLOWER_BASIC_AUTH:?Set FLOWER_BASIC_AUTH in .env} --persistent=True --db=/data/flower.db
    container_name: {{ cookiecutter.project_slug }}_flower
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
      {% if cookiecutter.database_engine != 'sqlite' %}
      DB_HOST: db
      {% if cookiecutter.database_engine == 'sqlserver' %}
      DB_USER: sa
      {% endif %}
      {% endif %}
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - {{ cookiecutter.project_slug }}_network
  {% endif %}

volumes:
  {% if cookiecutter.database_engine == 'sqlite' %}
  sqlite_data:
  {% elif cookiecutter.database_engine == 'postgresql' %}
  postgres_data:
  {% elif cookiecutter.database_engine == 'mysql' %}
  mysql_data:
  {% elif cookiecutter.database_engine == 'sqlserver' %}
  sqlserver_data:
  {% endif %}
  static_data:
  media_data:
  nginx_logs:
  {% if cookiecutter.use_celery == 'y' %}
  flower_data:
  {% endif %}
  {% if cookiecutter.cloud_storage == 'silo' %}
  silo_data:
  {% endif %}

networks:
  {{ cookiecutter.project_slug }}_network:
    driver: bridge
