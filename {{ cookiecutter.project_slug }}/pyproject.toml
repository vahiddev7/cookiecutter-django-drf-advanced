[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "A clean Django project template"
authors = ["{{ cookiecutter.author_name }}"]

[tool.poetry.dependencies]
python = "^3.10"
django = "5.2.13"
django-environ = "0.13.0"
django-extensions = "4.1"
django-cors-headers = "4.9.0"
django-storages = "1.14.6"
pillow = "12.2.0"
requests = "2.33.1"
persiantools = "5.5.0"
{% if cookiecutter.cloud_storage == "s3" %}
boto3 = ">=1.34.0"
{% elif cookiecutter.cloud_storage == "gcloud" %}
google-cloud-storage = ">=2.16.0"
{% elif cookiecutter.cloud_storage == "azure" %}
azure-storage-blob = ">=12.19.0"
{% endif %}

{% if cookiecutter.database_engine == "postgresql" %}
psycopg2-binary = "2.9.11"
{% elif cookiecutter.database_engine == "mysql" %}
pymysql = "1.2.3"
{% elif cookiecutter.database_engine == "sqlserver" %}
mssql-django = "2.0.0"
{% endif %}

{% if cookiecutter.use_drf == "y" %}
djangorestframework = "3.17.1"
djangorestframework-simplejwt = "5.5.1"
django-filter = "25.2"
{% endif %}

{% if cookiecutter.use_drf == "y" and cookiecutter.use_swagger == "y" %}
drf-spectacular = "0.29.0"
{% endif %}

{% if cookiecutter.use_sentry == "y" %}
sentry-sdk = ">=2.0.0,<3.0.0"
{% endif %}

{% if cookiecutter.use_celery == "y" %}
celery = ">=5.0.0"
{% if cookiecutter.celery_broker == "redis" %}
redis = ">=4.0.0"
{% endif %}
{% endif %}

[tool.poetry.group.test.dependencies]
pytest = "9.0.3"
pytest-django = "4.12.0"
factory-boy = "3.3.3"
Faker = "40.15.0"

[tool.poetry.group.dev.dependencies]
ipython = "8.39.0"
pre-commit = "4.5.1"
flake8 = "7.3.0"
ipdb = "0.13.13"
mypy = "1.20.1"
django-stubs = "6.0.3"
{% if cookiecutter.use_drf == "y" %}
djangorestframework-stubs = "3.16.9"
{% endif %}
boto3-stubs = "1.42.93"

[tool.poetry.group.production]
optional = true

[tool.poetry.group.production.dependencies]
gunicorn = "25.3.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
