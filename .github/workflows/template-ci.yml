name: Cookiecutter template CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out template
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Cookiecutter
        run: python -m pip install --upgrade pip cookiecutter

      - name: Generate a minimal project
        run: >-
          cookiecutter --no-input . --output-dir "$RUNNER_TEMP/generated"
          project_name="CI Smoke Test"
          project_slug=ci_smoke
          author_name=CI
          use_drf=y
          use_swagger=n
          use_docker=n
          database_engine=sqlite
          use_celery=n
          celery_broker=redis

      - name: Install runtime and test dependencies
        working-directory: ${{ runner.temp }}/generated/ci_smoke
        run: >-
          python -m pip install
          Django==5.2.13
          django-environ==0.13.0
          djangorestframework==3.17.1
          djangorestframework-simplejwt==5.5.1
          pytest==9.0.3
          pytest-django==4.12.0

      - name: Check Django configuration
        working-directory: ${{ runner.temp }}/generated/ci_smoke
        run: python manage.py check

      - name: Check migrations
        working-directory: ${{ runner.temp }}/generated/ci_smoke
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: ${{ runner.temp }}/generated/ci_smoke
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: ${{ runner.temp }}/generated/ci_smoke
        run: pytest
