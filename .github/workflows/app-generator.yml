name: App generator smoke test

on:
  pull_request:
    paths:
      - "{{ cookiecutter.project_slug }}/scripts/start_app.sh"
      - ".github/workflows/app-generator.yml"
  workflow_dispatch:

jobs:
  generated-app:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-never-use-in-production
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cookiecutter
        run: python -m pip install --upgrade pip cookiecutter

      - name: Generate a minimal project
        run: >-
          cookiecutter --no-input . --output-dir "$RUNNER_TEMP/generated"
          project_name="App Generator Test"
          project_slug=app_generator_test
          author_name=CI
          use_drf=y
          use_swagger=n
          use_docker=n
          database_engine=sqlite
          use_celery=n
          celery_broker=redis

      - name: Install runtime dependencies
        working-directory: ${{ runner.temp }}/generated/app_generator_test
        run: python -m pip install -r requirements/base.txt

      - name: Generate and validate an app
        working-directory: ${{ runner.temp }}/generated/app_generator_test
        run: |
          bash scripts/start_app.sh blog 'Blog "Management"'
          if bash scripts/start_app.sh InvalidName; then
            echo "Invalid app name was unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e apps/InvalidName
          python - <<'PY'
          from pathlib import Path

          urls_path = Path("config/urls.py")
          urls = urls_path.read_text()
          urls = urls.replace(
              "urlpatterns = [",
              'urlpatterns = [\\n    path("api/conflict/", include("apps.blog.urls")),',
              1,
          )
          urls_path.write_text(urls)
          PY
          if bash scripts/start_app.sh conflict; then
            echo "Conflicting API route was unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e apps/conflict
          python manage.py check
          python - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          from django.urls import get_resolver
          from apps.blog.apps import BlogConfig

          assert BlogConfig.verbose_name == 'Blog "Management"'
          assert "apps.blog" in settings.INSTALLED_APPS
          patterns = get_resolver().url_patterns
          assert any(str(pattern.pattern) == "api/blog/" for pattern in patterns)
          PY
