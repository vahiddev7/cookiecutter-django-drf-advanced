name: Generated project CI

on:
  pull_request:
  push:
    branches: ["master", "ci/**"]
  workflow_dispatch:

jobs:
  generated-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite-drf-minimal
            database_engine: sqlite
            use_drf: y
            use_swagger: n
            use_docker: n
            use_celery: n
            use_sentry: n
            cloud_storage: none
            celery_broker: redis
          - name: sqlite-full-options
            database_engine: sqlite
            use_drf: y
            use_swagger: y
            use_docker: y
            use_celery: y
            use_sentry: y
            cloud_storage: s3
            celery_broker: redis
          - name: sqlite-silo-storage
            database_engine: sqlite
            use_drf: y
            use_swagger: n
            use_docker: y
            use_celery: n
            use_sentry: n
            cloud_storage: silo
            celery_broker: redis
          - name: sqlite-without-drf
            database_engine: sqlite
            use_drf: n
            use_swagger: n
            use_docker: y
            use_celery: y
            use_sentry: n
            cloud_storage: none
            celery_broker: rabbitmq
          - name: postgresql-rabbitmq
            database_engine: postgresql
            use_drf: y
            use_swagger: n
            use_docker: y
            use_celery: y
            use_sentry: n
            cloud_storage: none
            celery_broker: rabbitmq
          - name: mysql-swagger
            database_engine: mysql
            use_drf: y
            use_swagger: y
            use_docker: y
            use_celery: n
            use_sentry: n
            cloud_storage: none
            celery_broker: redis
          - name: sqlserver-redis
            database_engine: sqlserver
            use_drf: y
            use_swagger: n
            use_docker: y
            use_celery: y
            use_sentry: n
            cloud_storage: none
            celery_broker: redis

    steps:
      - uses: actions/checkout@v4

      - name: Reject wildcard ALLOWED_HOSTS default
        run: |
          if grep -Fxq 'ALLOWED_HOSTS=*' '{{ cookiecutter.project_slug }}/.env.example'; then
            echo "Unsafe wildcard ALLOWED_HOSTS default found in .env.example" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cookiecutter
        run: python -m pip install --upgrade pip cookiecutter

      - name: Generate project (${{ matrix.name }})
        run: >-
          cookiecutter --no-input . --output-dir "$RUNNER_TEMP/generated"
          project_name="CI Test Project"
          project_slug=ci_test_project
          author_name=CI
          use_drf=${{ matrix.use_drf }}
          use_swagger=${{ matrix.use_swagger }}
          use_docker=${{ matrix.use_docker }}
          database_engine=${{ matrix.database_engine }}
          use_celery=${{ matrix.use_celery }}
          use_sentry=${{ matrix.use_sentry }}
          cloud_storage=${{ matrix.cloud_storage }}
          celery_broker=${{ matrix.celery_broker }}

      - name: Configure S3 bucket for containerized CI
        if: matrix.cloud_storage == 's3'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: sed -i 's/^AWS_STORAGE_BUCKET_NAME=$/AWS_STORAGE_BUCKET_NAME=ci-test-bucket/' .env

      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python -m pip install -r requirements/base.txt pytest pytest-django

      - name: Verify optional feature output
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        env:
          USE_DRF: ${{ matrix.use_drf }}
          USE_SWAGGER: ${{ matrix.use_swagger }}
          USE_CELERY: ${{ matrix.use_celery }}
          USE_SENTRY: ${{ matrix.use_sentry }}
          CLOUD_STORAGE: ${{ matrix.cloud_storage }}
          DATABASE_ENGINE: ${{ matrix.database_engine }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          if os.environ["USE_DRF"] == "n":
              assert not Path("apps/authentication").exists()
          else:
              assert Path("apps/authentication").is_dir()

          if os.environ["USE_CELERY"] == "n":
              assert not Path("config/celery.py").exists()
          else:
              assert Path("config/celery.py").is_file()

          if os.environ["USE_DRF"] == "y":
              from config.settings.base import INSTALLED_APPS, SIMPLE_JWT
              blacklist_app = "rest_framework_simplejwt.token_blacklist"
              if os.environ["DATABASE_ENGINE"] == "sqlserver":
                  assert blacklist_app not in INSTALLED_APPS
                  assert SIMPLE_JWT["ROTATE_REFRESH_TOKENS"] is False
                  assert SIMPLE_JWT["BLACKLIST_AFTER_ROTATION"] is False
              else:
                  assert blacklist_app in INSTALLED_APPS
                  assert SIMPLE_JWT["ROTATE_REFRESH_TOKENS"] is True
                  assert SIMPLE_JWT["BLACKLIST_AFTER_ROTATION"] is True

          from config.settings.base import LOGGING
          assert LOGGING["version"] == 1
          assert "console" in LOGGING["handlers"]
          sentry_settings = Path("config/settings/sentry.py")
          base_settings = Path("config/settings/base.py").read_text()
          if os.environ["USE_SENTRY"] == "n":
              assert not sentry_settings.exists()
              assert "from .sentry import configure_sentry" not in base_settings
          else:
              assert sentry_settings.is_file()
              assert "from .sentry import configure_sentry" in base_settings

          storage_settings = Path("config/settings/storage.py")
          if os.environ["CLOUD_STORAGE"] == "none":
              assert not storage_settings.exists()
              assert "from .storage import STORAGES" not in Path("config/settings/base.py").read_text()
          elif os.environ["CLOUD_STORAGE"] in {"s3", "silo"}:
              assert storage_settings.is_file()
              from config.settings.base import STORAGES
              assert STORAGES["default"]["BACKEND"] == "storages.backends.s3.S3Storage"
              assert STORAGES["staticfiles"]["BACKEND"] == "storages.backends.s3.S3Storage"
              if os.environ["CLOUD_STORAGE"] == "silo":
                  compose = Path("docker-compose.yml").read_text()
                  env_file = Path(".env").read_text()
                  assert "pgsty/silo:RELEASE.2026-10-26T00-00-00Z" in compose
                  assert "silo-init:" in compose
                  assert "silo_data:/data" in compose
                  assert "MINIO_ROOT_USER=silo_" in env_file
                  assert "MINIO_ROOT_PASSWORD=" in env_file
                  assert "AWS_ACCESS_KEY_ID=silo_" in env_file
                  assert "AWS_SECRET_ACCESS_KEY=" in env_file

          if os.environ["USE_DRF"] == "n" or os.environ["USE_SWAGGER"] == "n":
              assert not Path("static/swagger").exists()
          else:
              assert Path("static/swagger").is_dir()
          PY

      - name: Django system checks
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python manage.py check

      - name: Verify generated app and test layout
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: |
          bash scripts/start_app.sh blog
          python - <<'PY'
          from pathlib import Path

          app_dir = Path("apps/blog")
          expected_tests = {"unit", "integration", "e2e"}
          actual_tests = {path.name for path in (app_dir / "tests").iterdir() if path.is_dir()}
          assert actual_tests == expected_tests, f"Unexpected test layout: {actual_tests}"

          expected_app_dirs = {"models", "migrations", "tests"}
          actual_app_dirs = {path.name for path in app_dir.iterdir() if path.is_dir()}
          assert actual_app_dirs == expected_app_dirs, f"Unexpected app scaffold: {actual_app_dirs}"
          assert all((app_dir / name).is_file() for name in ("apps.py", "admin.py", "urls.py"))
          assert (app_dir / "tests" / "__init__.py").is_file()
          assert all((app_dir / "tests" / name / "__init__.py").is_file() for name in expected_tests)
          settings = Path("config/settings/base.py").read_text()
          urls = Path("config/urls.py").read_text()
          assert '"apps.blog"' in settings
          assert 'include("apps.blog.urls")' in urls
          PY
          python manage.py check

      - name: Validate Docker Compose configuration
        if: matrix.use_docker == 'y'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: docker compose config --quiet

      - name: Verify generated RabbitMQ credentials
        if: matrix.use_celery == 'y' && matrix.celery_broker == 'rabbitmq'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: |
          grep -Eq '^RABBITMQ_DEFAULT_USER=app_[a-f0-9]{16}$' .env
          grep -Eq '^RABBITMQ_DEFAULT_PASS=.{32,}$' .env

      - name: Start selected Celery broker
        if: matrix.use_docker == 'y' && matrix.use_celery == 'y'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: docker compose up -d broker

      - name: Run migrations against the selected database
        if: matrix.use_docker == 'y'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: docker compose run --rm migrate sh -c "python manage.py migrate --noinput"

      - name: Run integration tests on PostgreSQL and SQL Server
        if: matrix.database_engine == 'postgresql' || matrix.database_engine == 'sqlserver'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: >-
          docker compose run --rm --no-deps app
          sh -c "python -m pip install --user pytest pytest-django && python -m pytest -q"

      - name: Stop Docker services
        if: always() && matrix.use_docker == 'y'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: docker compose down --volumes --remove-orphans

      - name: Check migrations
        if: matrix.database_engine == 'sqlite'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python manage.py makemigrations --check --dry-run --verbosity 3

      - name: Apply migrations
        if: matrix.database_engine == 'sqlite'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python manage.py migrate --noinput

      - name: Run project tests
        if: matrix.database_engine == 'sqlite'
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: pytest -q
