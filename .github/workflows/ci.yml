name: Generated project CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  generated-project:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-never-use-in-production
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4

      - name: Reject wildcard ALLOWED_HOSTS default
        run: |
          if grep -Eq '^ALLOWED_HOSTS=\*$' '{{ cookiecutter.project_slug }}/.env.example'; then
            echo "Unsafe wildcard ALLOWED_HOSTS default found in .env.example" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cookiecutter
        run: python -m pip install --upgrade pip cookiecutter

      - name: Generate a minimal SQLite project
        run: >-
          cookiecutter --no-input . --output-dir "$RUNNER_TEMP/generated"
          project_name="CI Test Project"
          project_slug=ci_test_project
          author_name=CI
          use_drf=y
          use_swagger=n
          use_docker=n
          database_engine=sqlite
          use_celery=n
          celery_broker=redis

      - name: Install project test dependencies
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: >-
          python -m pip install
          Django==5.2.13
          django-environ==0.13.0
          djangorestframework==3.17.1
          djangorestframework-simplejwt==5.5.1
          pytest
          pytest-django

      - name: Django system checks
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python manage.py check

      - name: Check migrations
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: ${{ runner.temp }}/generated/ci_test_project
        run: pytest -q
