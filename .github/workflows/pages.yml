name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate documentation files
        run: |
          test -s docs/index.html
          test -s docs/quickstart.html
          test -s docs/configuration.html
          test -s docs/architecture.html
          test -s docs/drf-best-practices.html
          test -s docs/releasing.html
          test -s docs/CHANGELOG.html
          test -s docs/sitemap.xml
          test -s docs/robots.txt
          grep -q 'rel="canonical"' docs/index.html
          grep -q 'rel="canonical"' docs/drf-best-practices.html
          grep -q 'Sitemap:' docs/robots.txt
          grep -q 'releasing.html' docs/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
